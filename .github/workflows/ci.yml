name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The publish workflow runs these same checks before it publishes.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true
      - run: vp check
      - run: vp pack
      # The rules list in docs/rules/README.md and each rule doc's header are generated
      # from the built plugin; fail if they no longer match it.
      - name: Generated docs are current
        run: npm run docs -- --check
      # The tarball the publish workflow would upload, without uploading it.
      - run: npm pack --dry-run

  test:
    name: test (node@${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", latest]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - name: Runtime
        run: node --version
      # Every test: each rule under ESLint's and Oxlint's RuleTester, and the
      # regression tests in tests/.
      - run: vp test
